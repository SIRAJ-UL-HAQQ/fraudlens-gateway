name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fraudlens_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24 runtime)

      - name: Set up Python 3.13.5
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (node24 runtime)
        with:
          python-version: "3.13.5"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt -c backend/constraints-linux.txt

      - name: Lint backend code
        run: ruff check backend/

      - name: Verify OpenAPI schema sync
        run: |
          PYTHONPATH=backend python scripts/generate_openapi.py
          git diff --exit-code docs/openapi.json

      - name: Run Pytest with coverage
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres_ci_password@localhost:5432/fraudlens_test
          REQUIRE_POSTGRES: "1"
          PYTHONPATH: backend
        run: |
          pytest backend/app/tests --cov=backend/app --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=85 -v

  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24 runtime)

      - name: Set up Python 3.13.5
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (node24 runtime)
        with:
          python-version: "3.13.5"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements-dev.txt
            ml/requirements-dev.txt
            backend/constraints-linux.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt -r ml/requirements-dev.txt -c backend/constraints-linux.txt

      - name: Lint ML code
        run: ruff check ml/

      - name: Run ML unit tests
        env:
          PYTHONPATH: backend:.
        run: |
          pytest ml/tests -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24 runtime)

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24 runtime)
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend code
        working-directory: frontend
        run: npm run lint

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24 runtime)

      - name: Set up Python 3.13.5
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (node24 runtime)
        with:
          python-version: "3.13.5"

      - name: Configure .env
        shell: bash
        run: |
          cp .env.example .env
          PG_PASS=$(openssl rand -hex 16)
          JWT_SEC=$(openssl rand -hex 32)
          ANALYST_PASS=$(openssl rand -hex 16)
          echo "::add-mask::${PG_PASS}"
          echo "::add-mask::${JWT_SEC}"
          echo "::add-mask::${ANALYST_PASS}"
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=${PG_PASS}/" .env
          sed -i "s/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=${JWT_SEC}/" .env
          sed -i "s/^ANALYST_PASSWORD=.*/ANALYST_PASSWORD=${ANALYST_PASS}/" .env

      - name: Build Docker images
        run: docker compose build

      - name: Start stack and wait for health
        run: docker compose up -d --wait

      - name: Run smoke test on backend (:8000)
        shell: bash
        run: EXPECT_MODEL_MODE=stub bash scripts/smoke_test.sh http://127.0.0.1:8000

      - name: Run smoke test on frontend proxy (:5173)
        shell: bash
        run: EXPECT_MODEL_MODE=stub bash scripts/smoke_test.sh http://127.0.0.1:5173

      - name: Check frontend static asset delivery
        shell: bash
        run: |
          # Static delivery check, does not prove the UI renders
          HTML_RESP=$(curl -fsS http://127.0.0.1:5173/)
          echo "$HTML_RESP" | grep '<div id="root">'
          JS_PATH=$(echo "$HTML_RESP" | grep -oE '/assets/index-[^"]+\.js')
          curl -fsS -o /dev/null -w 'HTTP_STATUS: %{http_code}\n' "http://127.0.0.1:5173${JS_PATH}"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down stack
        if: always()
        run: docker compose down -v
